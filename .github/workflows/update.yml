name: Günlük AI Portföy Güncelleyici

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Kopyala
        uses: actions/checkout@v4

      - name: Python ve Kütüphane Kurulumu
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai requests

      - name: Botu Çalıştır
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python update_portfolio.py

      - name: Değişiklikleri Sitede Yayınla
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.io"
          git add portfolio_data.json
          git commit -m "Otomatik Günlük AI Portföy Verisi [skip ci]" || exit 0
          git push
