<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kişisel Finans & AI Portföy</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 p-2 rounded-xl text-white">
                    <i class="fa-solid fa-chart-line text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">Portföy & AI Özet</h1>
                    <p class="text-xs text-slate-400">Yapay Zeka Destekli Günlük Piyasa Analizi</p>
                </div>
            </div>
            
            <div class="flex items-center gap-3 w-full sm:w-auto">
                <div class="relative flex-1 sm:w-64">
                    <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                    <input type="text" id="searchInput" placeholder="Varlık ara..." 
                        class="w-full bg-slate-900 border border-slate-800 rounded-lg pl-9 pr-4 py-2 text-sm focus:outline-none focus:border-indigo-500 text-slate-200 placeholder-slate-500">
                </div>
                <button onclick="loadPortfolioData()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2 cursor-pointer whitespace-nowrap">
                    <i class="fa-solid fa-arrows-rotate"></i> Yenile
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        
        <!-- Filter Tabs -->
        <div class="flex gap-2 overflow-x-auto pb-4 mb-6 border-b border-slate-800/60 scrollbar-none">
            <button onclick="filterCategory('all')" class="cat-btn px-4 py-2 rounded-lg text-sm font-medium bg-indigo-600 text-white transition cursor-pointer">Tümü</button>
            <button onclick="filterCategory('bist')" class="cat-btn px-4 py-2 rounded-lg text-sm font-medium bg-slate-900 text-slate-400 hover:bg-slate-800 hover:text-slate-200 transition cursor-pointer">Borsa İstanbul (BIST)</button>
            <button onclick="filterCategory('us')" class="cat-btn px-4 py-2 rounded-lg text-sm font-medium bg-slate-900 text-slate-400 hover:bg-slate-800 hover:text-slate-200 transition cursor-pointer">ABD Borsaları</button>
            <button onclick="filterCategory('crypto')" class="cat-btn px-4 py-2 rounded-lg text-sm font-medium bg-slate-900 text-slate-400 hover:bg-slate-800 hover:text-slate-200 transition cursor-pointer">Kripto Paralar</button>
        </div>

        <!-- Cards Grid (Dinamik olarak doldurulacak) -->
        <div id="cardsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full text-center py-12 text-slate-500">
                <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i>
                <p>Yapay zeka verileri yükleniyor...</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="max-w-7xl mx-auto px-4 py-8 border-t border-slate-900 text-center text-xs text-slate-600">
        <p>Kişisel Portföy Takip Sistemi • Yapay Zeka Destekli Günlük Analiz</p>
    </footer>

    <!-- Script for Loading Data and Filters -->
    <script>
        let allAssets = [];

        async function loadPortfolioData() {
            try {
                const response = await fetch('portfolio_data.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error("Veri bulunamadı");
                allAssets = await response.json();
                renderCards(allAssets);
            } catch (error) {
                console.error("Veri yüklenirken hata:", error);
                document.getElementById('cardsGrid').innerHTML = `
                    <div class="col-span-full bg-slate-900/60 border border-slate-800 rounded-2xl p-8 text-center">
                        <i class="fa-solid fa-triangle-exclamation text-amber-400 text-3xl mb-3"></i>
                        <h3 class="text-lg font-bold text-slate-200 mb-1">Henüz Yapay Zeka Özeti Oluşturulmamış</h3>
                        <p class="text-xs text-slate-400 mb-4">Botu GitHub Actions üzerinden ilk kez çalıştırarak verileri üretebilirsiniz.</p>
                        <span class="text-xs text-indigo-400 font-mono">Actions -> Günlük AI Portföy Güncelleyici -> Run workflow</span>
                    </div>
                `;
            }
        }

        function getSentimentBadge(sentiment) {
            if (sentiment === "Yüksek Olumlu") return '<span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-xs px-2.5 py-1 rounded-full font-medium">Yüksek Olumlu</span>';
            if (sentiment === "Olumlu") return '<span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-xs px-2.5 py-1 rounded-full font-medium">Olumlu</span>';
            if (sentiment === "Nötr") return '<span class="bg-amber-500/10 text-amber-400 border border-amber-500/20 text-xs px-2.5 py-1 rounded-full font-medium">Nötr</span>';
            return '<span class="bg-rose-500/10 text-rose-400 border border-rose-500/20 text-xs px-2.5 py-1 rounded-full font-medium">Dikkat</span>';
        }

        function getCategoryLabel(category) {
            if (category === 'bist') return 'BIST';
            if (category === 'us') return 'ABD Borsaları';
            return 'Kripto Para';
        }

        function renderCards(assets) {
            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = '';

            assets.forEach(asset => {
                const card = document.createElement('div');
                card.className = "asset-card bg-slate-900/60 border border-slate-800 rounded-2xl p-5 flex flex-col justify-between hover:border-slate-700 transition";
                card.setAttribute('data-category', asset.category);
                card.setAttribute('data-name', `${asset.symbol.toLowerCase()} ${asset.name.toLowerCase()}`);

                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-3">
                            <div>
                                <span class="text-xs font-semibold text-indigo-400 uppercase tracking-wider">${getCategoryLabel(asset.category)}</span>
                                <h3 class="text-lg font-bold text-slate-100">${asset.symbol} <span class="text-xs font-normal text-slate-400">${asset.name}</span></h3>
                            </div>
                            ${getSentimentBadge(asset.sentiment)}
                        </div>
                        <div class="bg-slate-950/50 border border-slate-800/80 rounded-xl p-3 mb-4 mt-3">
                            <div class="flex items-center gap-1.5 text-xs font-medium text-indigo-300 mb-1">
                                <i class="fa-solid fa-wand-magic-sparkles"></i> AI Günlük Özet
                            </div>
                            <p class="text-xs text-slate-300 leading-relaxed">
                                ${asset.summary}
                            </p>
                        </div>
                    </div>
                    <div class="flex justify-between items-center pt-3 border-t border-slate-800/50 text-xs text-slate-500">
                        <span>Otomatik Güncellendi</span>
                        <span class="text-indigo-400">AI Analiz</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterCategory(category) {
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('bg-indigo-600', 'text-white');
                btn.classList.add('bg-slate-900', 'text-slate-400');
            });
            event.target.classList.remove('bg-slate-900', 'text-slate-400');
            event.target.classList.add('bg-indigo-600', 'text-white');

            document.querySelectorAll('.asset-card').forEach(card => {
                if (category === 'all' || card.dataset.category === category) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        document.getElementById('searchInput').addEventListener('input', function(e) {
            const term = e.target.value.toLowerCase();
            document.querySelectorAll('.asset-card').forEach(card => {
                const name = card.dataset.name;
                if (name.includes(term)) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        });

        // Sayfa açıldığında verileri yükle
        loadPortfolioData();
    </script>
</body>
</html>
